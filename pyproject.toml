[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-synapcores"
version = "0.1.0"
description = "LangChain integration for SynapCores, the AI-native database: vector store and in-database embeddings."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "SynapCores" }]
keywords = ["langchain", "synapcores", "vector store", "embeddings", "rag", "database"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "langchain-core>=1.0.0,<2.0.0",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://synapcores.com"
Documentation = "https://github.com/SynapCores/langchain-synapcores#readme"
Source = "https://github.com/SynapCores/langchain-synapcores"
Playground = "https://synapcores.com/playground"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "langchain-tests>=1.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_synapcores"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["requires_engine: needs a running SynapCores gateway"]
