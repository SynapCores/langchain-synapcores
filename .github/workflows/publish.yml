name: publish
# Push a tag like v0.1.0 to build and publish langchain-synapcores to PyPI.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere.
# One-time setup on pypi.org: add a pending publisher for project
# "langchain-synapcores", owner SynapCores, repo langchain-synapcores,
# workflow publish.yml, environment pypi.
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version matches the tag
        run: |
          V=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$V" = "${GITHUB_REF_NAME#v}"
      - run: pip install -e ".[test]" build
      - run: pytest tests/unit_tests -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
